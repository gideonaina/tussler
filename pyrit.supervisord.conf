[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
loglevel=info

[program:jupyter]
command=python3 -m notebook --ip=0.0.0.0 --no-browser --NotebookApp.port=8888 --NotebookApp.token=''
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autostart=true
autorestart=true
stderr_logfile_maxbytes=0
stderr_logfile_backups=0

[program:uvicorn]
command=uvicorn tussler_pyrit.launcher:app --host 0.0.0.0 --port 8080 --log-level info --workers 3
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
autostart=true
autorestart=true
stderr_logfile_maxbytes=0
stderr_logfile_backups=0
